amcl:
  ros__parameters:
    use_sim_time: false

    # Frames and topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan

    # RBY1 uses mecanum wheels
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Odometry motion noise
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Update thresholds
    update_min_d: 0.05
    update_min_a: 0.05

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120

    sigma_hit: 0.20
    lambda_short: 0.10

    z_hit: 0.50
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.50

    do_beamskip: false
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90

    # TF
    tf_broadcast: true
    transform_tolerance: 0.50

    # Initial pose is assigned from RViz
    set_initial_pose: true
    always_reset_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # 이전 위치를 다음 실행에 재사용하지 않음
    save_pose_rate: -1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0