/**:
  ros__parameters:
    # Empty uses rby1_sdk.upc.GripperDeviceName (/dev/rby1_gripper).
    device_name: ""
    baud_rate: 2000000
    right_motor_id: 0
    left_motor_id: 1
    torque_constants: [1.0, 1.0]

    # Values match the upstream SDK gripper example. Validate them on your
    # hardware before carrying payloads.
    position_torque_limit: 5.0
    homing_torque: 0.3

    # Normalized command semantics: 0.0=open, 1.0=closed. The upstream
    # gripper example reaches the closed end at the smaller encoder value.
    closed_at_minimum: [true, true]
    endpoint_margin_ratio: 0.0
    minimum_calibration_span_rad: 0.01

    # Homing moves both grippers through their complete travel, so it is an
    # explicit service call by default.
    auto_home: false
    homing_sample_period_sec: 0.1
    # Encoder values are quantized, so this effectively requires no encoder
    # tick movement for 30 consecutive samples, matching the SDK example.
    homing_stall_threshold_rad: 0.000001
    homing_stall_samples: 30
    homing_direction_timeout_sec: 15.0
    homing_max_read_failures: 3

    # Set use_saved_calibration=true after copying endpoint values printed by
    # a successful homing run. This starts without full-travel motion.
    use_saved_calibration: false
    calibration_min_rad: [0.0, 0.0]
    calibration_max_rad: [0.0, 0.0]
    auto_enable_torque: true
    disable_torque_on_shutdown: true

    control_rate_hz: 10.0
    state_rate_hz: 10.0

    # Loopback-only mode for checking ROS topics/services without hardware.
    # This does not drive the MuJoCo gripper model.
    mock_hardware: false
